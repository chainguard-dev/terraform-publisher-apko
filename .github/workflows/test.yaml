name: Tests
on:
  # pull_request_target is deliberate: fork PRs need the OIDC token to test
  # keyless cosign signing, which plain pull_request does not grant them.
  # Untrusted fork code is gated behind the reviewer-approved
  # acceptance-tests environment, see the test job below.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: ['main']
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions: {}

jobs:
  test:
    # This job runs twice per PR. The pull_request_target run uses the base
    # branch's workflow with an OIDC token for this repo, so it can sign as
    # test.yaml@refs/heads/main and verify those signatures. The
    # pull_request run uses the PR's own copy of this workflow, so changes
    # to it are tested before merge, but skips signature verification. The
    # names are distinct so branch protection can require each one; the
    # verification check stays pending on fork PRs until the
    # acceptance-tests environment is approved.
    name: ${{ github.event_name == 'pull_request_target' && 'Test with signature verification' || 'Test without signature verification' }}
    runs-on: ubuntu-latest

    # Fork PRs must wait for reviewer approval on the acceptance-tests
    # environment before the job runs: it executes the PR's code with an
    # OIDC token for this repo. PRs from branches in this repo (write access
    # already), pull_request and push events run without approval. A PR
    # whose head repo was deleted has a null head.repo, so it is gated too.
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'acceptance-tests' || '' }}

    permissions:
      contents: read
      id-token: write

    steps:
    - name: Harden the runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          api.github.com:443
          checkpoint-api.hashicorp.com:443
          fulcio.sigstore.dev:443
          ghcr.io:443
          github.com:443
          packages.wolfi.dev:443
          pkg-containers.githubusercontent.com:443
          registry.terraform.io:443
          rekor.sigstore.dev:443
          release-assets.githubusercontent.com:443
          releases.hashicorp.com:443
          spdx.org:443
          timestamp.sigstore.dev:443
          tuf-repo-cdn.sigstore.dev:443

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      if: github.event_name == 'pull_request_target'
      with:
        ref: refs/pull/${{ github.event.pull_request.number }}/merge
        persist-credentials: false

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      if: github.event_name != 'pull_request_target'
      with:
        persist-credentials: false

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.22'
        check-latest: true

    - uses: chainguard-dev/actions/setup-registry@805da2efdffdc42b8afd8880e575a48b471ef544 # v1.6.37
      with:
        port: 5000

    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: '1.8.*'
        terraform_wrapper: false

    - working-directory: ./examples/static
      env:
        TF_VAR_target_repository: localhost:5000/static
        TF_VAR_verify: ${{github.event_name == 'pull_request_target'}}
      run: |
        terraform init -upgrade
        terraform apply -auto-approve

    # Test with archs and check_sbom=false
    - working-directory: ./examples/static
      env:
        TF_VAR_target_repository: localhost:5000/static
        TF_VAR_archs: '["x86_64"]'
        TF_VAR_check_sbom: 'false'
        TF_VAR_verify: ${{github.event_name == 'pull_request_target'}}
      run: |
        terraform init -upgrade
        terraform apply -auto-approve

    # Test dual signing (legacy + bundle) via signature_format=both
    - working-directory: ./examples/static
      env:
        TF_VAR_target_repository: localhost:5000/static
        TF_VAR_archs: '["x86_64"]'
        TF_VAR_signature_format: both
        TF_VAR_verify: ${{github.event_name == 'pull_request_target'}}
      run: |
        terraform init -upgrade
        terraform apply -auto-approve
